# OpenTelemetry Collector Contrib configuration
# Fashion Atelier AI Platform (v3.1) — Centralized Traces & Metrics Pipeline
#
# Receivers:
#   - OTLP gRPC :4317
#   - OTLP HTTP :4318 (used by @atelier/observability OTLPTraceExporter)
# Exporters:
#   - Traces  -> Grafana Tempo (tempo:4317 via OTLP gRPC)
#   - Metrics -> Prometheus scrape endpoint (:8889/metrics)

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 200
    spike_limit_mib: 40

  batch:
    send_batch_size: 512
    send_batch_max_size: 1024
    timeout: 2s

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

  prometheus:
    endpoint: 0.0.0.0:8889
    namespace: atelier_otel
    send_timestamps: true
    metric_expiration: 5m
    resource_to_telemetry_conversion:
      enabled: true

  debug:
    verbosity: basic

service:
  extensions:
    - health_check
  telemetry:
    logs:
      level: info
  pipelines:
    traces:
      receivers:
        - otlp
      processors:
        - memory_limiter
        - batch
      exporters:
        - otlp/tempo
    metrics:
      receivers:
        - otlp
      processors:
        - memory_limiter
        - batch
      exporters:
        - prometheus
