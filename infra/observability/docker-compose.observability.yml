# Centralized Observability Stack (OTel Collector + Prometheus + Tempo + Grafana)
# Fashion Atelier AI Platform (v3.1)
#
# Opt-in profile:
#   docker compose -f infra/docker-compose.yml -f infra/observability/docker-compose.observability.yml --profile observability up -d
# Or included directly by `infra/docker-compose.prod.yml` with `--profile observability`.
#
# Storage Lock-In (Project-Local Bind Mounts):
#   All persistent data is stored under `../../.project-data/volumes/observability/*`
#   and every container rotates JSON logs (max 10m x 2 files).

x-obs-logging: &obs-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "2"

services:
  atelier-tempo:
    image: grafana/tempo:2.6.1
    container_name: atelier-tempo
    profiles:
      - observability
    restart: unless-stopped
    mem_limit: 256m
    logging: *obs-logging
    command: ["-config.file=/etc/tempo.yaml"]
    ports:
      - "${TEMPO_HTTP_PORT:-3200}:3200"
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml:ro
      - ../../.project-data/volumes/observability/tempo:/var/tempo
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3200/ready | grep -qi ready"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      atelier_net:
        aliases:
          - tempo

  atelier-otel-collector:
    image: otel/opentelemetry-collector-contrib:0.114.0
    container_name: atelier-otel-collector
    profiles:
      - observability
    restart: unless-stopped
    mem_limit: 256m
    logging: *obs-logging
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    depends_on:
      atelier-tempo:
        condition: service_started
    ports:
      - "${OTEL_GRPC_PORT:-4317}:4317"
      - "${OTEL_HTTP_PORT:-4318}:4318"
      - "${OTEL_PROM_PORT:-8889}:8889"
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:13133/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      atelier_net:
        aliases:
          - otel-collector

  atelier-prometheus:
    image: prom/prometheus:v2.55.1
    container_name: atelier-prometheus
    profiles:
      - observability
    restart: unless-stopped
    mem_limit: 384m
    logging: *obs-logging
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../../.project-data/volumes/observability/prometheus:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/-/healthy | grep -qi healthy"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      atelier_net:
        aliases:
          - prometheus

  atelier-grafana:
    image: grafana/grafana:11.3.1
    container_name: atelier-grafana
    profiles:
      - observability
    restart: unless-stopped
    mem_limit: 256m
    logging: *obs-logging
    depends_on:
      atelier-prometheus:
        condition: service_started
      atelier-tempo:
        condition: service_started
    ports:
      - "${GRAFANA_PORT:-3030}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-atelier_ops}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/atelier-overview.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ../../.project-data/volumes/observability/grafana:/var/lib/grafana
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health | grep -qi ok"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      atelier_net:
        aliases:
          - grafana

networks:
  atelier_net:
    driver: bridge
