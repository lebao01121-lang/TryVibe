# Prometheus scrape configuration
# Fashion Atelier AI Platform (v3.1) — Full 14-Process & Infrastructure Telemetry

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s
  external_labels:
    platform: fashion-atelier-ai-platform
    version: "3.1.0"

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
        labels:
          service: prometheus
          tier: observability

  # Zero-Trust API Gateway & Fashion BFF (:4000)
  - job_name: bff
    metrics_path: /metrics
    static_configs:
      - targets:
          - bff:4000
        labels:
          service: bff
          tier: gateway

  # 8 Isolated DDD Microservices (:4001 - :4008)
  - job_name: auth-customer
    metrics_path: /metrics
    static_configs:
      - targets:
          - auth-customer:4001
        labels:
          service: auth-customer
          tier: microservice

  - job_name: catalog-lookbook
    metrics_path: /metrics
    static_configs:
      - targets:
          - catalog-lookbook:4002
        labels:
          service: catalog-lookbook
          tier: microservice

  - job_name: media-pipeline
    metrics_path: /metrics
    static_configs:
      - targets:
          - media-pipeline:4003
        labels:
          service: media-pipeline
          tier: microservice

  - job_name: inventory
    metrics_path: /metrics
    static_configs:
      - targets:
          - inventory:4004
        labels:
          service: inventory
          tier: microservice

  - job_name: cart-outfit
    metrics_path: /metrics
    static_configs:
      - targets:
          - cart-outfit:4005
        labels:
          service: cart-outfit
          tier: microservice

  - job_name: order-rma
    metrics_path: /metrics
    static_configs:
      - targets:
          - order-rma:4006
        labels:
          service: order-rma
          tier: microservice

  - job_name: payment-promo
    metrics_path: /metrics
    static_configs:
      - targets:
          - payment-promo:4007
        labels:
          service: payment-promo
          tier: microservice

  - job_name: notify-review
    metrics_path: /metrics
    static_configs:
      - targets:
          - notify-review:4008
        labels:
          service: notify-review
          tier: microservice

  # Python FastAPI AI Virtual Try-On API (:4009)
  - job_name: ai-tryon-api
    metrics_path: /metrics
    static_configs:
      - targets:
          - ai-tryon-api:4009
        labels:
          service: ai-tryon-api
          tier: ai

  # 8-Layer Admin/Customer MCP Copilot (:4010)
  - job_name: mcp-copilot
    metrics_path: /metrics
    static_configs:
      - targets:
          - mcp-copilot:4010
        labels:
          service: mcp-copilot
          tier: ai

  # OpenTelemetry Collector Prometheus Exporter (:8889)
  - job_name: otel-collector
    metrics_path: /metrics
    static_configs:
      - targets:
          - otel-collector:8889
        labels:
          service: otel-collector
          tier: observability

  # RabbitMQ Prometheus Plugin Exporter (:15692)
  - job_name: atelier-rabbitmq
    metrics_path: /metrics
    static_configs:
      - targets:
          - atelier-rabbitmq:15692
        labels:
          service: atelier-rabbitmq
          tier: messaging
