apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://atelier-prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      httpMethod: POST
      timeInterval: 15s
      exemplarTraceIdDestinations:
        - name: traceID
          datasourceUid: tempo

  - name: Tempo
    type: tempo
    uid: tempo
    access: proxy
    url: http://atelier-tempo:3200
    isDefault: false
    editable: true
    jsonData:
      httpMethod: GET
      nodeGraph:
        enabled: true
      serviceMap:
        datasourceUid: prometheus
      tracesToMetrics:
        datasourceUid: prometheus
        spanStartTimeShift: -1m
        spanEndTimeShift: 1m
        tags:
          - key: service.name
            value: service
        queries:
          - name: Request Rate
            query: sum(rate(atelier_http_requests_total{$__tags}[5m]))
          - name: HTTP Latency p95
            query: histogram_quantile(0.95, sum(rate(atelier_http_request_duration_seconds_bucket{$__tags}[5m])) by (le))
          - name: HTTP 5xx Error Rate (%)
            query: 100 * sum(rate(atelier_http_requests_total{$__tags,status_code=~"5.."}[5m])) / clamp_min(sum(rate(atelier_http_requests_total{$__tags}[5m])), 1e-9)
