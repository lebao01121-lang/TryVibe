name: fashion-atelier-ai-platform

# Total persistent container mem_limit budget:
#   atelier-postgres    512m
#   atelier-redis       256m
#   atelier-meilisearch 512m
#   atelier-rabbitmq    512m
#   atelier-minio       384m
#   atelier-mailpit     128m
#   atelier-nginx       128m
#   (atelier-minio-mc    64m one-shot init job)
# Total: 2432m (~2.38 GiB) steady-state / 2496m (~2.44 GiB) peak (< 3.00 GiB)
#
# Local AI Inference (v3.1 — 100% Local Ollama, $0 API cost):
#   Default execution connects directly to Host Ollama
#   (http://127.0.0.1:11434 on host / http://host.docker.internal:11434 from containers)
#   to maximize native GPU acceleration (NVIDIA CUDA / Apple Silicon / AMD ROCm)
#   with zero virtualization overhead.
#   To run Ollama inside Docker instead, start with:
#     docker compose --profile ollama-docker up -d
#
# Storage Lock-In (Project-Local Bind Mounts):
#   All persistent data is bound relative to `infra/docker-compose.yml` under
#   `../.project-data/volumes/<service>` (D:\doancosothue\TryVibe\.project-data\volumes\*)
#   and every container rotates JSON logs (max 10m x 2 files) so Docker never bloats C:.

x-default-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "2"

services:
  atelier-postgres:
    image: pgvector/pgvector:pg16
    container_name: atelier-postgres
    restart: unless-stopped
    mem_limit: 512m
    logging: *default-logging
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-atelier_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Atelier_Pg2026!}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      TZ: Asia/Ho_Chi_Minh
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - max_connections=150
      - -c
      - work_mem=4MB
    volumes:
      - ../.project-data/volumes/atelier_pgdata:/var/lib/postgresql/data
      - ./sql/init-isolated-dbs.sql:/docker-entrypoint-initdb.d/01-init-isolated-dbs.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-atelier_admin} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - atelier_net

  atelier-redis:
    image: redis:7-alpine
    container_name: atelier-redis
    restart: unless-stopped
    mem_limit: 256m
    logging: *default-logging
    ports:
      - "6379:6379"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-Atelier_Redis2026!}
    command:
      - /bin/sh
      - -c
      - exec redis-server --appendonly yes --maxmemory 192mb --maxmemory-policy allkeys-lru --requirepass "$$REDIS_PASSWORD"
    volumes:
      - ../.project-data/volumes/atelier_redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - atelier_net

  atelier-meilisearch:
    image: getmeili/meilisearch:v1.11
    container_name: atelier-meilisearch
    restart: unless-stopped
    mem_limit: 512m
    logging: *default-logging
    ports:
      - "7700:7700"
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: ${MEILISEARCH_MASTER_KEY:-Atelier_Meili_Master_2026_Key}
      MEILI_NO_ANALYTICS: "true"
      MEILI_MAX_INDEXING_MEMORY: 256Mb
    volumes:
      - ../.project-data/volumes/atelier_meilidata:/meili_data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:7700/health | grep -q available || curl -fsS http://127.0.0.1:7700/health | grep -q available"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - atelier_net

  atelier-rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: atelier-rabbitmq
    restart: unless-stopped
    mem_limit: 512m
    logging: *default-logging
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-atelier_mq}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-Atelier_Mq2026!}
      RABBITMQ_VM_MEMORY_HIGH_WATERMARK: "0.7"
    volumes:
      - ../.project-data/volumes/atelier_rmqdata/mnesia:/var/lib/rabbitmq/mnesia
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - atelier_net

  atelier-minio:
    image: minio/minio:latest
    container_name: atelier-minio
    restart: unless-stopped
    mem_limit: 384m
    logging: *default-logging
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-atelier_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-Atelier_Minio2026!}
    command: ["server", "/data", "--console-address", ":9001"]
    volumes:
      - ../.project-data/volumes/atelier_miniodata:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live || wget -q --spider http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - atelier_net

  atelier-minio-mc:
    image: minio/mc:latest
    container_name: atelier-minio-mc
    restart: "no"
    mem_limit: 64m
    logging: *default-logging
    depends_on:
      atelier-minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-atelier_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-Atelier_Minio2026!}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mc alias set local http://atelier-minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing local/atelier-public
        mc mb --ignore-existing local/atelier-garments
        mc mb --ignore-existing local/atelier-private-tryon
        mc anonymous set download local/atelier-public
        mc anonymous set none local/atelier-garments
        mc anonymous set none local/atelier-private-tryon
        mc ilm ls local/atelier-private-tryon | grep -q "1d" || mc ilm rule add --expire-days 1 local/atelier-private-tryon
        echo "MinIO buckets (atelier-public, atelier-garments, atelier-private-tryon) configured."
    networks:
      - atelier_net

  atelier-mailpit:
    image: axllent/mailpit:latest
    container_name: atelier-mailpit
    restart: unless-stopped
    mem_limit: 128m
    logging: *default-logging
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8025/livez || /mailpit readyz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - atelier_net

  atelier-nginx:
    image: nginx:1.27-alpine
    container_name: atelier-nginx
    restart: unless-stopped
    mem_limit: 128m
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --no-check-certificate -O- https://127.0.0.1/nginx-health | grep -q OK"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - atelier_net

  # Optional containerized Ollama daemon (opt-in via `--profile ollama-docker`).
  # By default, services connect to Host Ollama (http://host.docker.internal:11434 / 127.0.0.1:11434)
  # for native GPU acceleration (NVIDIA CUDA / Apple Silicon / AMD ROCm) with zero virtualization overhead.
  atelier-ollama:
    image: ollama/ollama:latest
    container_name: atelier-ollama
    profiles:
      - ollama-docker
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "11434:11434"
    volumes:
      - ../.project-data/volumes/ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1 || wget -qO- http://127.0.0.1:11434/api/tags >/dev/null 2>&1 || ollama list >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - atelier_net

networks:
  atelier_net:
    driver: bridge
